name: Release APK

# Publishes the GitHub release that the in-app updater looks for.
# It runs when app/build.gradle.kts changes on main (that is where versionName is raised) and does nothing if the release
# v<versionName> already exists. It can also be started by hand: Actions -> Release APK -> Run workflow.
# The release gets the signed release APK as ExpressiveKeyboard-<versionName>.apk and the text of release-notes/<versionName>.md.

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - "app/build.gradle.kts"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-apk
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read the version
        id: ver
        run: |
          VER=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          if ! echo "$VER" | grep -Eq '^[0-9]+(\.[0-9]+)+$'; then
            echo "versionName '$VER' is not like 11.2.15"; exit 1
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Is it already released?
        id: exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v${{ steps.ver.outputs.version }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v${{ steps.ver.outputs.version }} exists, nothing to do"
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Android setup
        if: steps.exists.outputs.found == 'false'
        uses: ./.github/actions/android-setup

      # Release key: stored only in GitHub secrets (Settings > Secrets and variables > Actions).
      #   KEYSTORE_B64 = the .p12 file as one line of text:  base64 -w0 ek-release.p12
      #   KEY_PASSWORD = its password (the key uses the same password as the file)
      # The values are filled in by GitHub while this job runs. They never appear in the code.
      - name: Load the release key from GitHub secrets
        if: steps.exists.outputs.found == 'false'
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ] || [ -z "${KEY_PASSWORD:-}" ]; then
            echo "::error::Secrets KEYSTORE_B64 and KEY_PASSWORD are not set. Add them, then run this workflow again."
            exit 1
          fi
          KS="$RUNNER_TEMP/ek-release.p12"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$KS"
          ALIAS=$(keytool -list -keystore "$KS" -storetype PKCS12 -storepass:env KEY_PASSWORD 2>/dev/null \
            | awk -F', ' '/PrivateKeyEntry/ {print $1; exit}' || true)
          if [ -z "$ALIAS" ]; then
            echo "::error::Could not open the key file. Check that KEYSTORE_B64 is the whole .p12 and KEY_PASSWORD is its password."
            exit 1
          fi
          # local.properties is read by app/build.gradle.kts (RELEASE_*); the backslash is doubled for the .properties format
          PW=$(printf '%s' "$KEY_PASSWORD" | sed 's/\\/\\\\/g')
          {
            echo "RELEASE_STORE_FILE=$KS"
            echo "RELEASE_STORE_PASSWORD=$PW"
            echo "RELEASE_KEY_ALIAS=$ALIAS"
            echo "RELEASE_KEY_PASSWORD=$PW"
          } >> local.properties

      - name: Build the release APK
        if: steps.exists.outputs.found == 'false'
        run: ./gradlew assembleRelease --stacktrace

      - name: Check that the release key signed the APK
        if: steps.exists.outputs.found == 'false'
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | grep -vi 'unsigned' | head -n 1)
          APKSIGNER=$(ls -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -z "$APKSIGNER" ]; then echo "::warning::apksigner not found, signer check skipped"; exit 0; fi
          GOT=$("$APKSIGNER" verify --print-certs "$APK" | grep -i 'certificate SHA-256 digest' | head -n 1 | awk '{print $NF}' | tr 'A-F' 'a-f')
          OLD=$(keytool -list -keystore signing/ci-debug.keystore -storetype PKCS12 -storepass android 2>/dev/null \
            | grep -i 'SHA-256' | head -n 1 | awk '{print $NF}' | tr -d ':' | tr 'A-F' 'a-f' || true)
          echo "APK signer SHA-256: $GOT"
          if [ -n "$OLD" ] && [ "$GOT" = "$OLD" ]; then
            echo "::error::The APK is signed with the old shared key, not the release key. Nothing was published."
            exit 1
          fi

      - name: Create the release
        if: steps.exists.outputs.found == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${{ steps.ver.outputs.version }}"
          APK=$(ls app/build/outputs/apk/release/*.apk | grep -vi 'unsigned' | head -n 1)
          if [ -z "$APK" ]; then echo "No signed release APK was built"; exit 1; fi
          cp "$APK" "ExpressiveKeyboard-$VER.apk"
          if [ -f "release-notes/$VER.md" ]; then
            NOTES="release-notes/$VER.md"
          else
            echo "Expressive Keyboard Pro $VER" > /tmp/notes.md
            NOTES=/tmp/notes.md
          fi
          gh release create "v$VER" "ExpressiveKeyboard-$VER.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Expressive Keyboard Pro $VER" \
            --notes-file "$NOTES" \
            --latest
