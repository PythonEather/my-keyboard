name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Plugin tests run first and fast (no Gradle): every plugin runs in a Node mock of kb and its GLSL shaders are compiled.
      # Put your own plugins in ./plugins (a .js with a manifest comment, a .json, or a folder with plugin.json + main.js).
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install the GLSL validator
        run: sudo apt-get update -q && sudo apt-get install -y -q glslang-tools

      - name: Plugin tests (Node mock of kb + shader compile)
        run: node tools/plugin-test/run.mjs --require-glslang

      - name: Android setup
        uses: ./.github/actions/android-setup

      - name: Use the private signing key from secrets (APKs update in place)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::Secret KEYSTORE_B64 is missing"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore

      - name: Build Release APK (fast, recommended)
        continue-on-error: true
        run: ./gradlew assembleRelease --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ExpressiveKeyboard-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Upload Debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ExpressiveKeyboard-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
