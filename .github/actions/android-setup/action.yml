name: Android setup
description: JDK 17, Gradle и встроенный шрифт Nunito — общая подготовка для всех сборок

runs:
  using: composite
  steps:
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Set up Android NDK
      shell: bash
      run: |
        # "yes | sdkmanager" fails under bash's default pipefail (yes gets SIGPIPE), so no pipe is used here.
        SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
        set +e
        sdkmanager --licenses < <(yes) > /dev/null 2>&1
        sdkmanager "ndk;28.2.13676358" > "$RUNNER_TEMP/sdkmanager.log" 2>&1
        set -e
        if [ ! -d "$SDK/ndk/28.2.13676358" ]; then
          echo "::error::NDK 28.2.13676358 is not installed"
          tail -n 40 "$RUNNER_TEMP/sdkmanager.log"
          exit 1
        fi
        echo "NDK ready: $SDK/ndk/28.2.13676358"

    - name: Make gradlew executable
      shell: bash
      run: chmod +x gradlew

    - name: Download bundled rounded font (Nunito, OFL)
      shell: bash
      run: |
        mkdir -p app/src/main/assets/fonts
        curl -fsSL --retry 3 -o app/src/main/assets/fonts/rounded.ttf \
          "https://raw.githubusercontent.com/google/fonts/main/ofl/nunito/Nunito%5Bwght%5D.ttf" \
          || { echo "::warning::Font download failed, system font will be used"; rm -f app/src/main/assets/fonts/rounded.ttf; }
        ls -la app/src/main/assets/fonts || true
