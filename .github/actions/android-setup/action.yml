name: Android setup
description: JDK 17, Gradle и встроенный шрифт Nunito — общая подготовка для всех сборок

runs:
  using: composite
  steps:
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Set up Android NDK
      shell: bash
      run: |
        set -e
        SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
        mkdir -p "$SDK_ROOT"

        SDKMANAGER=""
        if command -v sdkmanager >/dev/null 2>&1; then
          SDKMANAGER="$(command -v sdkmanager)"
        else
          for candidate in \
            "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK_ROOT/cmdline-tools/bin/sdkmanager" \
            "$SDK_ROOT/tools/bin/sdkmanager"; do
            if [ -x "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi
          done
        fi

        if [ -z "$SDKMANAGER" ]; then
          TOOLS_ZIP="/tmp/commandlinetools-linux.zip"
          curl -fsSL --retry 3 -o "$TOOLS_ZIP" \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          mkdir -p "$SDK_ROOT/cmdline-tools/tmp"
          unzip -q "$TOOLS_ZIP" -d "$SDK_ROOT/cmdline-tools/tmp"
          rm -rf "$SDK_ROOT/cmdline-tools/latest"
          mv "$SDK_ROOT/cmdline-tools/tmp/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          rm -rf "$SDK_ROOT/cmdline-tools/tmp" "$TOOLS_ZIP"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          chmod +x "$SDKMANAGER"
        fi

        accept_and_run() {
          set +o pipefail
          (while true; do printf 'y\n'; sleep 0.2 2>/dev/null || true; done) | "$SDKMANAGER" --sdk_root="$SDK_ROOT" "$@" 2>/dev/null || true
          set -o pipefail
        }

        accept_and_run --licenses
        if [ ! -d "$SDK_ROOT/ndk/28.2.13676358" ]; then
          accept_and_run "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358"
        fi

        if [ ! -d "$SDK_ROOT/ndk/28.2.13676358" ]; then
          echo "::error::NDK 28.2.13676358 was not installed in $SDK_ROOT/ndk"
          exit 1
        fi

        echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
        echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
        echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"
        echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

    - name: Make gradlew executable
      shell: bash
      run: chmod +x gradlew

    - name: Download bundled rounded font (Nunito, OFL)
      shell: bash
      run: |
        mkdir -p app/src/main/assets/fonts
        curl -fsSL --retry 3 -o app/src/main/assets/fonts/rounded.ttf \
          "https://raw.githubusercontent.com/google/fonts/main/ofl/nunito/Nunito%5Bwght%5D.ttf" \
          || { echo "::warning::Font download failed, system font will be used"; rm -f app/src/main/assets/fonts/rounded.ttf; }
        ls -la app/src/main/assets/fonts || true
