name: Android setup
description: JDK 17, Gradle, Android NDK and bundled Nunito font for all builds

runs:
  using: composite
  steps:
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Set up Android NDK
      shell: bash
      run: |
        NDK_VER="28.2.13676358"
        SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
        echo "Runner image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"
        echo "SDK folder: $SDK"

        find_sdkmanager() {
          command -v sdkmanager 2>/dev/null && return 0
          for p in "$SDK"/cmdline-tools/latest/bin/sdkmanager "$SDK"/cmdline-tools/*/bin/sdkmanager "$SDK"/tools/bin/sdkmanager; do
            if [ -x "$p" ]; then echo "$p"; return 0; fi
          done
          return 1
        }

        SDKM="$(find_sdkmanager || true)"

        if [ -z "$SDKM" ]; then
          echo "sdkmanager not found, downloading Android command line tools"
          if ! mkdir -p "$SDK/cmdline-tools" 2>/dev/null; then
            SDK="$HOME/android-sdk"
            mkdir -p "$SDK/cmdline-tools"
          fi
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/cmdline-tools.zip" \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          rm -rf "$RUNNER_TEMP/cmdline-tools-unzip"
          unzip -q "$RUNNER_TEMP/cmdline-tools.zip" -d "$RUNNER_TEMP/cmdline-tools-unzip"
          rm -rf "$SDK/cmdline-tools/latest"
          mv "$RUNNER_TEMP/cmdline-tools-unzip/cmdline-tools" "$SDK/cmdline-tools/latest"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
        fi

        echo "Using sdkmanager: $SDKM"
        export ANDROID_HOME="$SDK"
        export ANDROID_SDK_ROOT="$SDK"
        echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
        echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

        # "yes | sdkmanager" fails under bash's default pipefail, so no pipe and no exit on error here.
        set +e
        "$SDKM" --sdk_root="$SDK" --licenses < <(yes) > /dev/null 2>&1
        "$SDKM" --sdk_root="$SDK" "ndk;$NDK_VER" > "$RUNNER_TEMP/sdkmanager.log" 2>&1
        set -e

        if [ ! -d "$SDK/ndk/$NDK_VER" ]; then
          echo "::error::NDK $NDK_VER is not installed"
          tail -n 40 "$RUNNER_TEMP/sdkmanager.log"
          exit 1
        fi
        echo "NDK ready: $SDK/ndk/$NDK_VER"

    - name: Make gradlew executable
      shell: bash
      run: chmod +x gradlew

    - name: Download bundled rounded font (Nunito, OFL)
      shell: bash
      run: |
        mkdir -p app/src/main/assets/fonts
        curl -fsSL --retry 3 -o app/src/main/assets/fonts/rounded.ttf \
          "https://raw.githubusercontent.com/google/fonts/main/ofl/nunito/Nunito%5Bwght%5D.ttf" \
          || { echo "::warning::Font download failed, system font will be used"; rm -f app/src/main/assets/fonts/rounded.ttf; }
        ls -la app/src/main/assets/fonts || true
